name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-tested.txt
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m unittest discover -s tests -q
      - name: Package desktop application
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Python (Get-Command python).Source -SkipInstall
      - uses: actions/upload-artifact@v4
        with:
          name: ParamID-Windows
          path: |
            release/ParamID-Portable.zip
            release/ParamID-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
